<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LLM Traffic Sim</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="c"></div>

<div id="hud">
    <div>Collisions: <span id="hud-collisions" style="color:#34c759">0</span></div>
    <div>LLM latency: <span id="hud-latency">--</span></div>
    <div>Cleared: <span id="hud-cleared">0</span></div>
</div>

<button id="theme-btn" onclick="toggleTheme()">
    <span id="theme-icon">🌙</span>
    <span id="theme-label">Dark Mode</span>
</button>

<div id="cam-btns">
    <button id="cam-perspective" class="active">3D View</button>
    <button id="cam-topdown">Top Down</button>
    <button id="cam-chase">Follow Car</button>
</div>

<!-- VEHICLE DETAILS PANEL -->
<div id="vehicle-panel">
    <div class="vp-header"><div class="vp-dot"></div>Live Vehicle Data</div>
    <div id="vp-list"></div>
</div>

<script src="lights.js"></script>
<script src="cars.js"></script>
<script src="sensors.js"></script>
<script src="render.js"></script>
<script src="main.js"></script>
</body>
</html>
